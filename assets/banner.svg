<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070f"/><stop offset="0.55" stop-color="#0b1530"/><stop offset="1" stop-color="#062a2a"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#818cf8"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22d3ee" stroke-opacity="0.07"/>
    </pattern>
    <radialGradient id="glow1" cx="0.85" cy="0.2" r="0.6"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.25"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="1" r="0.6"><stop offset="0" stop-color="#34d399" stop-opacity="0.2"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow1)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="url(#ac)" stroke-opacity="0.5"/>

  <!-- window dots -->
  <circle cx="40" cy="38" r="6" fill="#ef4444"/><circle cx="62" cy="38" r="6" fill="#f59e0b"/><circle cx="84" cy="38" r="6" fill="#22c55e"/>
  <text x="110" y="43" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#64748b">~/mohamedghanem-dev — zsh</text>

  <text x="60" y="118" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="20" fill="#34d399">$ whoami</text>
  <text x="60" y="185" font-family="Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="72" font-weight="800" fill="url(#ac)">Mohamed Ghanem</text>

  <!-- rotating roles -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="24" fill="#e2e8f0">
    <text x="62" y="238" opacity="1">Full-Stack Developer &amp; Software Engineer
      <animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;0.2;0.22;0.4;0.6;0.8;0.9;0.98;1" dur="15s" repeatCount="indefinite"/></text>
    <text x="62" y="238" opacity="0">Websites • Stores • SaaS Platforms
      <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.2;0.24;0.4;0.44;0.9;1" dur="15s" repeatCount="indefinite"/></text>
    <text x="62" y="238" opacity="0">Flutter &amp; Android • Windows &amp; Linux Desktop
      <animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.4;0.44;0.48;0.64;0.68;1" dur="15s" repeatCount="indefinite"/></text>
    <text x="62" y="238" opacity="0">n8n Automation • Telegram Bots • APIs
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.64;0.68;0.84;0.88;1" dur="15s" repeatCount="indefinite"/></text>
    <text x="62" y="238" opacity="0">Open Source • AI-Assisted Engineering
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.84;0.88;0.97;1" dur="15s" repeatCount="indefinite"/></text>
  </g>
  <rect x="62" y="262" width="260" height="4" rx="2" fill="url(#ac)">
    <animate attributeName="width" values="60;420;60" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- floating code tags -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" fill="#22d3ee" fill-opacity="0.35" font-size="40">
    <text x="980" y="120">&lt;/&gt;<animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0" dur="4s" repeatCount="indefinite"/></text>
    <text x="1060" y="230" fill="#34d399">{ }<animateTransform attributeName="transform" type="translate" values="0,0;0,14;0,0" dur="5s" repeatCount="indefinite"/></text>
    <text x="900" y="250" fill="#818cf8">&gt;_<animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="6s" repeatCount="indefinite"/></text>
  </g>
</svg>
